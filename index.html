<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Congélo V12 (Multi-Appareil) ❄️📦</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0288d1">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        :root {
            --primary: #0288d1;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #333;
            --danger: #e53935;
            --success: #43a047;
            --warning: #fdd835;
            --drawer-tag: #5c6bc0;
            --freezer-tag: #00838f; /* Nouvelle couleur pour l'appareil */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }

        /* --- Zone Recherche & Filtres --- */
        .tools-area {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #777;
        }

        .filters-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap; 
        }

        .filter-select {
            flex: 1;
            min-width: 120px; 
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            font-size: 0.9rem;
        }

        /* --- Formulaire Ajout --- */
        .add-form {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-top: 4px solid var(--primary);
        }

        input, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            flex: 1;
            font-size: 16px;
        }

        .input-mini { flex: 0 0 60px; min-width: 50px; }
        
        /* Nouvelle ligne pour les champs de localisation (freezer + drawer) */
        .location-row { display: flex; flex-basis: 100%; gap: 8px; }


        button#add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            flex-basis: 100%;
            font-size: 1rem;
            cursor: pointer;
        }

        /* --- Liste --- */
        ul { list-style: none; padding: 0; }

        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #ddd;
        }

        .item-left { display: flex; align-items: center; gap: 12px; flex: 1; }

        .category-icon {
            font-size: 1.8rem;
            background: #f5f5f5;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .item-info h3 { margin: 0; font-size: 1.1rem; color: #222; }
        
        .meta-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .date-text { font-size: 0.85rem; color: #666; }
        
        .badge { /* Base pour les badges */
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        
        .drawer-badge {
            background-color: var(--drawer-tag);
        }
        
        .freezer-badge { /* Nouveau style pour l'appareil */
            background-color: var(--freezer-tag); 
        }

        /* --- Contrôles Droite (Boutons) --- */
        .actions-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f9f9f9;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        
        .qty-btn {
            width: 28px; height: 28px; border: none; border-radius: 6px;
            font-weight: bold; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-minus { background: #ffcdd2; color: #c62828; }
        .btn-plus { background: #c8e6c9; color: #2e7d32; }
        .qty-display { font-weight: bold; min-width: 20px; text-align: center; font-size: 0.9rem; }

        /* Bouton Recette */
        .recipe-btn {
            background-color: #fff3e0;
            color: #e65100;
            border: 1px solid #ffe0b2;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .recipe-btn:hover { background-color: #ffe0b2; }

        /* --- Codes Couleurs --- */
        .expired { border-left-color: var(--danger); background-color: #fffafa; }
        .soon { border-left-color: var(--warning); }
        .fresh { border-left-color: var(--success); }

        /* --- Backup --- */
        .backup-section {
            text-align: center; margin-top: 40px; padding: 20px;
            background: #e0e0e0; border-radius: 12px;
        }
        .backup-btn {
            padding: 8px 15px; margin: 5px; border: none;
            border-radius: 6px; cursor: pointer; background: #555; color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>❄️ Mon Congélo</h1>

    <div class="tools-area">
        <div class="search-box">
            <span class="search-icon">🔎</span>
            <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="renderList()">
        </div>
        
        <div class="filters-row">
            <select id="filterFreezer" class="filter-select" onchange="renderList()">
                <option value="all">Tous Appareils</option>
                <option value="C1">C1 (Principal)</option>
                <option value="C2">C2 (Secondaire)</option>
                <option value="C3">C3 (Tiers)</option>
            </select>
            
            <select id="filterCategory" class="filter-select" onchange="renderList()">
                <option value="all">Toutes Catégories</option>
                <option value="viande">🥩 Viandes</option>
                <option value="legume">🥦 Légumes</option>
                <option value="plat">🍲 Plats</option>
                <option value="sucre">🍦 Sucré</option>
                <option value="pain">🥖 Pain</option>
                <option value="autre">🧊 Autre</option>
            </select>

            <select id="filterDrawer" class="filter-select" onchange="renderList()">
                <option value="all">Tous Tiroirs</option>
                <option value="1">Tiroir 1</option>
                <option value="2">Tiroir 2</option>
                <option value="3">Tiroir 3</option>
                <option value="4">Tiroir 4</option>
                <option value="5">Tiroir 5</option>
                <option value="6">Tiroir 6</option>
                <option value="?">Non rangé (?)</option>
            </select>
        </div>
    </div>

    <div class="add-form">
        <select id="itemCategory" class="input-mini">
            <option value="viande">🥩</option>
            <option value="legume">🥦</option>
            <option value="plat" selected>🍲</option>
            <option value="sucre">🍦</option>
            <option value="pain">🥖</option>
            <option value="autre">🧊</option>
        </select>
        
        <input type="text" id="itemName" placeholder="Produit..." required>
        
        <div class="location-row">
            <select id="itemFreezer" style="flex: 2;">
                <option value="C1">C1 (Principal)</option>
                <option value="C2">C2 (Secondaire)</option>
                <option value="C3">C3 (Tiers)</option>
            </select>
            <input type="number" id="itemDrawer" placeholder="Tir." class="input-mini" min="1" max="9">
        </div>
        
        <input type="number" id="itemQty" placeholder="Qté" value="1" class="input-mini">
        <input type="date" id="itemDate">
        
        <button id="add-btn" onclick="addItem()">Ajouter</button>
    </div>

    <ul id="inventory-list"></ul>

    <div class="backup-section">
        <h3>Sauvegarde</h3>
        <button class="backup-btn" onclick="exportData()">📥 Sauvegarder</button>
        <button class="backup-btn" onclick="document.getElementById('fileInput').click()">📤 Restaurer</button>
        <input type="file" id="fileInput" style="display: none;" onchange="importData(this)">
    </div>
</div>

<script>
    // --- Initialisation ---
    // Clé de sauvegarde mise à jour pour éviter les conflits avec les anciennes versions (Utilisation d'une nouvelle clé V12)
    let inventory = JSON.parse(localStorage.getItem('freezerV12')) || []; 
    const listElement = document.getElementById('inventory-list');
    
    // Si la V12 est vide, tente de migrer les anciennes données V6/V5
    if (inventory.length === 0) {
        const legacyData = localStorage.getItem('freezerV6') || localStorage.getItem('freezerV5');
        if (legacyData) {
            try {
                // Tente de parser, en assumant que c'est un tableau
                inventory = JSON.parse(legacyData).map(item => ({
                    ...item,
                    freezer: 'C1' // Migration : assigne C1 par défaut
                }));
            } catch (e) {
                console.error("Erreur de parsing des données héritées", e);
            }
        }
    }


    const icons = { viande: '🥩', legume: '🥦', plat: '🍲', sucre: '🍦', pain: '🥖', autre: '🧊' };

    function save() {
        // Enregistrement sur la nouvelle clé V12
        localStorage.setItem('freezerV12', JSON.stringify(inventory));
        renderList();
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const cat = document.getElementById('itemCategory').value;
        const qty = parseInt(document.getElementById('itemQty').value) || 1;
        const date = document.getElementById('itemDate').value;
        const drawer = document.getElementById('itemDrawer').value;
        const freezer = document.getElementById('itemFreezer').value; // NOUVEAU: Appareil

        if (!name.trim()) return alert('Nom manquant !');

        inventory.push({ 
            id: Date.now(), 
            name, 
            category: cat, 
            qty, 
            date, 
            drawer: drawer || '?',
            freezer: freezer || 'C1' // Enregistre l'appareil
        });
        save();
        
        document.getElementById('itemName').value = '';
        document.getElementById('itemQty').value = '1'; 
        // Réinitialisation des champs pour la prochaine saisie
        document.getElementById('itemFreezer').value = 'C1'; 
        document.getElementById('itemDrawer').value = ''; 
        document.getElementById('itemDate').value = '';
        document.getElementById('itemName').focus();
    }

    function updateQty(id, change) {
        const index = inventory.findIndex(i => i.id === id);
        if (index === -1) return;
        
        inventory[index].qty += change;

        if (inventory[index].qty <= 0) {
            if (confirm(`Supprimer ${inventory[index].name} ?`)) {
                inventory.splice(index, 1);
            } else {
                inventory[index].qty = 1; 
            }
        }
        save();
    }

    function exportData() {
        const dataStr = JSON.stringify(inventory);
        const link = document.createElement('a');
        link.href = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        link.download = `congelo_v12_backup_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
    }

    function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(confirm(`Remplacer la liste actuelle (${inventory.length} items) par la sauvegarde (${importedData.length} items) ?`)) {
                    // Assure la compatibilité avec le champ 'freezer' si la sauvegarde est ancienne
                    inventory = importedData.map(item => ({
                         ...item,
                         freezer: item.freezer || 'C1' 
                    }));
                    save();
                    alert("Données restaurées avec succès !");
                }
            } catch(err) {
                alert("Erreur : Fichier invalide.");
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    function getRecipeUrl(term) {
        return `https://www.marmiton.org/recettes/recherche.aspx?aqt=${encodeURIComponent(term)}`;
    }

    // --- Rendu ---
    function renderList() {
        listElement.innerHTML = '';
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const catFilter = document.getElementById('filterCategory').value;
        const drawFilter = document.getElementById('filterDrawer').value;
        const freezerFilter = document.getElementById('filterFreezer').value; // NOUVEAU: Filtre Appareil
        
        const filtered = inventory.filter(item => {
            const matchSearch = item.name.toLowerCase().includes(searchVal);
            const matchCat = (catFilter === 'all' || item.category === catFilter);
            
            // FILTRE APPAREIL
            const itemFreezer = item.freezer || 'C1'; 
            const matchFreezer = (freezerFilter === 'all' || itemFreezer === freezerFilter);

            // FILTRE TIROIR
            const itemDrawer = item.drawer ? item.drawer.toString() : '?';
            const matchDrawer = (drawFilter === 'all' || itemDrawer === drawFilter);
            
            return matchSearch && matchCat && matchFreezer && matchDrawer;
        });
        
        filtered.sort((a, b) => {
            // Tri 1: par appareil (C1, C2, C3)
            const freezerA = a.freezer || 'C1';
            const freezerB = b.freezer || 'C1';
            if (freezerA !== freezerB) {
                return freezerA.localeCompare(freezerB);
            }
            
            // Tri 2: par date de péremption
            if (!a.date) return 1;
            if (!b.date) return -1;
            return new Date(a.date) - new Date(b.date);
        });

        if (filtered.length === 0) {
            listElement.innerHTML = '<div style="text-align:center; padding:20px; color:#999">Rien trouvé 🕸️</div>';
            return;
        }

        filtered.forEach(item => {
            const li = document.createElement('li');
            
            let dateInfo = '';
            let statusClass = 'fresh';
            if(item.date) {
                const diff = Math.ceil((new Date(item.date) - new Date()) / (86400000));
                const dateFr = new Date(item.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
                if(diff < 0) { statusClass = 'expired'; dateInfo = `⚠️ ${dateFr}`; }
                else if(diff < 30) { statusClass = 'soon'; dateInfo = `🕒 ${dateFr}`; }
                else { dateInfo = `📅 ${dateFr}`; }
            }

            // NOUVEAU: Badge Appareil
            const freezerBadge = item.freezer 
                ? `<span class="badge freezer-badge">${item.freezer}</span>` 
                : '';
                
            const drawerBadge = item.drawer && item.drawer !== '?' 
                ? `<span class="badge drawer-badge">Tir. ${item.drawer}</span>` 
                : '';

            li.className = `item-card ${statusClass}`;
            
            const recipeLink = getRecipeUrl(item.name);

            li.innerHTML = `
                <div class="item-left">
                    <div class="category-icon">${icons[item.category] || '🧊'}</div>
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <div class="meta-info">
                            ${freezerBadge} ${drawerBadge} <span class="date-text">${dateInfo}</span>
                        </div>
                    </div>
                </div>
                
                <div class="actions-right">
                    <div class="qty-controls">
                        <button class="qty-btn btn-minus" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-display">${item.qty}</span>
                        <button class="qty-btn btn-plus" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                    <a href="${recipeLink}" target="_blank" class="recipe-btn">
                        👨‍🍳 Idée
                    </a>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail', err));
        });
    }

    renderList();
</script>
</body>
</html>
