<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Congélo V7 🚀</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0288d1">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        :root {
            --primary: #0288d1;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #333;
            --text-sec: #666;
            --border: #ddd;
            --danger: #e53935;
            --success: #43a047;
            --warning: #fdd835;
            --drawer-tag: #5c6bc0;
            --shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --primary: #4fc3f7;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-sec: #aaaaaa;
            --border: #333;
            --shadow: 0 2px 5px rgba(0,0,0,0.3);
            --drawer-tag: #3949ab;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            padding-bottom: 90px;
            transition: background 0.3s, color 0.3s;
        }

        .container { max-width: 600px; margin: 0 auto; }

        /* --- En-tête & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        .view-toggle {
            display: flex;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2px;
            border: 1px solid var(--border);
        }
        .view-btn {
            padding: 8px 15px;
            border: none;
            background: transparent;
            color: var(--text-sec);
            cursor: pointer;
            border-radius: 18px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .view-btn.active {
            background: var(--primary);
            color: white; /* Toujours blanc sur le bouton actif */
        }

        .theme-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
        }

        /* --- Outils & Filtres --- */
        .tools-area {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg);
            color: var(--text);
        }

        .filters-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        
        .filter-select, .sort-btn {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* --- Formulaire --- */
        .add-form {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
        }
        
        .add-form.editing { border-left-color: var(--warning); }

        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            flex: 1;
            font-size: 16px;
            background: var(--bg);
            color: var(--text);
        }

        .input-mini { flex: 0 0 60px; min-width: 50px; }

        button.action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex-basis: 100%;
            cursor: pointer;
        }
        
        button.cancel-btn {
            background-color: var(--text-sec);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            display: none; /* Caché par défaut */
        }

        /* --- Liste --- */
        ul { list-style: none; padding: 0; }

        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--border);
            position: relative;
        }

        .item-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }

        .category-icon {
            font-size: 1.5rem;
            background: var(--bg);
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .item-info { min-width: 0; }
        .item-info h3 { margin: 0; font-size: 1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .meta-info {
            display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 0.8rem; color: var(--text-sec);
        }

        .drawer-badge {
            background-color: var(--drawer-tag); color: white;
            padding: 2px 5px; border-radius: 4px; font-weight: bold; font-size: 0.7rem;
        }

        /* --- Contrôles Item --- */
        .actions-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .qty-controls {
            display: flex; align-items: center; gap: 2px;
            background: var(--bg); padding: 2px; border-radius: 6px;
        }
        
        .qty-btn {
            width: 24px; height: 24px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-minus { background: #ffcdd2; color: #b71c1c; }
        .btn-plus { background: #c8e6c9; color: #1b5e20; }
        .qty-display { font-weight: bold; min-width: 18px; text-align: center; font-size: 0.85rem; color: var(--text); }

        .card-tools { display: flex; gap: 5px; margin-top: 2px; }
        .tool-btn {
            font-size: 0.8rem; padding: 3px 6px; border-radius: 4px;
            text-decoration: none; cursor: pointer; border: 1px solid var(--border);
            background: var(--bg); color: var(--text);
        }
        .btn-edit { color: var(--primary); border-color: var(--primary); }
        .btn-shop { color: var(--warning); border-color: var(--warning); } /* Icône Caddie */

        /* --- Codes Couleurs --- */
        .expired { border-left-color: var(--danger); }
        .soon { border-left-color: var(--warning); }
        .fresh { border-left-color: var(--success); }

        /* --- Liste Courses Spécifique --- */
        .shopping-mode .add-form { border-left-color: var(--warning); }
        .shopping-mode #itemDrawer, .shopping-mode #itemDate { display: none; }
        .shopping-mode .item-card { border-left-color: var(--warning); opacity: 0.9; }
        
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>❄️ Mon Congélo</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">🌙</button>
    </header>

    <div style="display:flex; justify-content:center; margin-bottom:15px;">
        <div class="view-toggle">
            <button class="view-btn active" id="btn-freezer" onclick="switchView('freezer')">🧊 Stock</button>
            <button class="view-btn" id="btn-shopping" onclick="switchView('shopping')">🛒 Courses</button>
        </div>
    </div>

    <div class="tools-area" id="tools-panel">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="renderList()">
        </div>
        
        <div class="filters-row">
            <select id="sortSelect" class="filter-select" onchange="renderList()">
                <option value="date">📅 Date (Péremption)</option>
                <option value="drawer">📂 Tiroir</option>
                <option value="name">🔤 Nom (A-Z)</option>
            </select>

            <select id="filterCategory" class="filter-select" onchange="renderList()">
                <option value="all">Tout</option>
                <option value="viande">🥩 Viandes</option>
                <option value="legume">🥦 Légumes</option>
                <option value="plat">🍲 Plats</option>
                <option value="sucre">🍦 Sucré</option>
                <option value="pain">🥖 Pain</option>
                <option value="autre">🧊 Autre</option>
            </select>

            <select id="filterDrawer" class="filter-select" onchange="renderList()">
                <option value="all">Tiroirs : Tous</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>
    </div>

    <div class="add-form" id="mainForm">
        <select id="itemCategory" class="input-mini">
            <option value="viande">🥩</option>
            <option value="legume">🥦</option>
            <option value="plat" selected>🍲</option>
            <option value="sucre">🍦</option>
            <option value="pain">🥖</option>
            <option value="autre">🧊</option>
        </select>
        
        <input type="text" id="itemName" placeholder="Produit..." required>
        <input type="number" id="itemDrawer" placeholder="Tir." class="input-mini" min="1" max="9">
        <input type="number" id="itemQty" placeholder="Qté" value="1" class="input-mini">
        <input type="date" id="itemDate">
        
        <button id="submit-btn" class="action-btn" onclick="handleFormSubmit()">Ajouter</button>
        <button id="cancel-btn" class="cancel-btn" onclick="resetForm()">Annuler</button>
    </div>

    <ul id="inventory-list"></ul>
    
    <div style="text-align:center; margin-top:30px; opacity:0.6; font-size:0.8rem;">
        <span onclick="exportData()">💾 Sauvegarder</span> | 
        <span onclick="document.getElementById('fileInput').click()">📂 Restaurer</span>
        <input type="file" id="fileInput" style="display: none;" onchange="importData(this)">
    </div>
</div>

<script>
    // --- Gestion des Données ---
    let inventory = JSON.parse(localStorage.getItem('freezerData')) || []; 
    let shoppingList = JSON.parse(localStorage.getItem('shoppingData')) || [];
    
    // Migration depuis V6 (si nécessaire)
    if (inventory.length === 0 && localStorage.getItem('freezerV5')) {
        inventory = JSON.parse(localStorage.getItem('freezerV5'));
        localStorage.removeItem('freezerV5'); // Nettoyage
        save();
    }

    let currentView = 'freezer'; // 'freezer' ou 'shopping'
    let editingId = null;
    const icons = { viande: '🥩', legume: '🥦', plat: '🍲', sucre: '🍦', pain: '🥖', autre: '🧊' };

    // --- Mode Sombre ---
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.dataset.theme = savedTheme;
    document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    function toggleTheme() {
        const newTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        document.body.dataset.theme = newTheme;
        localStorage.setItem('theme', newTheme);
        document.getElementById('themeIcon').textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }

    // --- Sauvegarde ---
    function save() {
        localStorage.setItem('freezerData', JSON.stringify(inventory));
        localStorage.setItem('shoppingData', JSON.stringify(shoppingList));
        renderList();
    }

    function switchView(view) {
        currentView = view;
        document.getElementById('btn-freezer').classList.toggle('active', view === 'freezer');
        document.getElementById('btn-shopping').classList.toggle('active', view === 'shopping');
        document.body.classList.toggle('shopping-mode', view === 'shopping');
        
        // Ajuster le formulaire selon la vue
        document.getElementById('submit-btn').textContent = view === 'shopping' ? "Ajouter à la liste" : "Ajouter au congélo";
        resetForm();
        renderList();
    }

    // --- Ajout / Édition ---
    function handleFormSubmit() {
        const name = document.getElementById('itemName').value.trim();
        const cat = document.getElementById('itemCategory').value;
        const qty = parseInt(document.getElementById('itemQty').value) || 1;
        const date = document.getElementById('itemDate').value;
        const drawer = document.getElementById('itemDrawer').value;

        if (!name) return alert('Nom manquant !');

        const targetArray = currentView === 'freezer' ? inventory : shoppingList;

        if (editingId) {
            // Modification
            const index = targetArray.findIndex(i => i.id === editingId);
            if (index !== -1) {
                targetArray[index] = { ...targetArray[index], name, category: cat, qty, date, drawer };
            }
        } else {
            // Création
            targetArray.push({ id: Date.now(), name, category: cat, qty, date, drawer: drawer || '?' });
        }

        save();
        resetForm();
    }

    function startEdit(id) {
        const targetArray = currentView === 'freezer' ? inventory : shoppingList;
        const item = targetArray.find(i => i.id === id);
        if (!item) return;

        document.getElementById('itemName').value = item.name;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemDrawer').value = item.drawer !== '?' ? item.drawer : '';
        document.getElementById('itemDate').value = item.date || '';

        editingId = id;
        document.getElementById('submit-btn').textContent = "Modifier";
        document.getElementById('cancel-btn').style.display = 'inline-block';
        document.getElementById('mainForm').classList.add('editing');
        document.getElementById('mainForm').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('itemName').value = '';
        document.getElementById('itemQty').value = '1';
        document.getElementById('itemDate').value = '';
        document.getElementById('itemDrawer').value = '';
        editingId = null;
        
        const btnText = currentView === 'freezer' ? "Ajouter au congélo" : "Ajouter à la liste";
        document.getElementById('submit-btn').textContent = btnText;
        document.getElementById('cancel-btn').style.display = 'none';
        document.getElementById('mainForm').classList.remove('editing');
    }

    // --- Actions Item ---
    function updateQty(id, change) {
        const targetArray = currentView === 'freezer' ? inventory : shoppingList;
        const index = targetArray.findIndex(i => i.id === id);
        if (index === -1) return;
        
        targetArray[index].qty += change;

        if (targetArray[index].qty <= 0) {
            if (currentView === 'freezer') {
                if (confirm(`Plus de ${targetArray[index].name}. Ajouter à la liste de courses ?`)) {
                    // Transfert vers Courses
                    let item = { ...targetArray[index], qty: 1, drawer: '?' };
                    shoppingList.push(item);
                    targetArray.splice(index, 1);
                } else if(confirm("Supprimer définitivement ?")) {
                    targetArray.splice(index, 1);
                } else {
                    targetArray[index].qty = 1; // Annulation
                }
            } else {
                // Suppression liste courses
                targetArray.splice(index, 1);
            }
        }
        save();
    }

    function moveToShop(id) {
        const index = inventory.findIndex(i => i.id === id);
        if (index === -1) return;
        const item = { ...inventory[index], qty: 1 }; // Reset qté pour achat
        shoppingList.push(item);
        inventory.splice(index, 1);
        save();
    }

    function restoreToFreezer(id) {
        const index = shoppingList.findIndex(i => i.id === id);
        if (index === -1) return;
        const item = shoppingList[index];
        
        // Demande info manquante pour le restockage
        const drawer = prompt(`Tiroir pour ${item.name} ?`, "1") || "?";
        item.drawer = drawer;
        item.date = new Date().toISOString().split('T')[0]; // Date du jour par défaut
        
        inventory.push(item);
        shoppingList.splice(index, 1);
        save();
    }

    // --- Rendu ---
    function renderList() {
        const listEl = document.getElementById('inventory-list');
        listEl.innerHTML = '';
        
        const targetArray = currentView === 'freezer' ? inventory : shoppingList;
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const catFilter = document.getElementById('filterCategory').value;
        const drawFilter = document.getElementById('filterDrawer').value;
        const sortMode = document.getElementById('sortSelect').value;

        // Filtrage
        let filtered = targetArray.filter(item => {
            const matchSearch = item.name.toLowerCase().includes(searchVal);
            const matchCat = (catFilter === 'all' || item.category === catFilter);
            const matchDrawer = (currentView === 'shopping') || (drawFilter === 'all' || (item.drawer && item.drawer.toString() === drawFilter));
            return matchSearch && matchCat && matchDrawer;
        });

        // Tri
        filtered.sort((a, b) => {
            if (sortMode === 'name') return a.name.localeCompare(b.name);
            if (sortMode === 'drawer') return (a.drawer || '9').toString().localeCompare((b.drawer || '9').toString());
            // Date par défaut
            if (!a.date) return 1;
            if (!b.date) return -1;
            return new Date(a.date) - new Date(b.date);
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sec)">Rien ici 🕸️</div>';
            return;
        }

        filtered.forEach(item => {
            const li = document.createElement('li');
            
            // Calcul État
            let dateInfo = '';
            let statusClass = 'fresh';
            if (currentView === 'freezer' && item.date) {
                const diff = Math.ceil((new Date(item.date) - new Date()) / (86400000));
                const dateFr = new Date(item.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
                if(diff < 0) { statusClass = 'expired'; dateInfo = `⚠️ ${dateFr}`; }
                else if(diff < 30) { statusClass = 'soon'; dateInfo = `🕒 ${dateFr}`; }
                else { dateInfo = `📅 ${dateFr}`; }
            }

            li.className = `item-card ${statusClass}`;
            
            const recipeLink = `https://www.marmiton.org/recettes/recherche.aspx?aqt=${encodeURIComponent(item.name)}`;
            
            // Boutons d'action spécifiques
            let actionBtn = '';
            if (currentView === 'freezer') {
                actionBtn = `<button class="tool-btn btn-shop" onclick="moveToShop(${item.id})" title="Envoyer liste courses">🛒 >List</button>`;
            } else {
                actionBtn = `<button class="tool-btn btn-shop" onclick="restoreToFreezer(${item.id})" title="Remettre au congélo">❄️ >Congélo</button>`;
            }

            const drawerHtml = (currentView === 'freezer' && item.drawer !== '?') 
                ? `<span class="drawer-badge">Tir. ${item.drawer}</span>` : '';

            li.innerHTML = `
                <div class="item-left">
                    <div class="category-icon">${icons[item.category] || '🧊'}</div>
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <div class="meta-info">
                            ${drawerHtml}
                            <span>${dateInfo}</span>
                        </div>
                        <div class="card-tools">
                            <button class="tool-btn btn-edit" onclick="startEdit(${item.id})">✏️ Edit</button>
                            <a href="${recipeLink}" target="_blank" class="tool-btn">👨‍🍳 Recette</a>
                            ${actionBtn}
                        </div>
                    </div>
                </div>
                
                <div class="actions-right">
                    <div class="qty-controls">
                        <button class="qty-btn btn-minus" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-display">${item.qty}</span>
                        <button class="qty-btn btn-plus" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `;
            listEl.appendChild(li);
        });
    }

    // --- Fonctions Système (Backup/PWA) ---
    function exportData() {
        const data = { inventory, shoppingList };
        const dataStr = JSON.stringify(data);
        const link = document.createElement('a');
        link.href = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        link.download = `congelo_backup_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
    }

    function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                // Support ancien format (tableau direct) ou nouveau format (objet)
                if (Array.isArray(data)) {
                    inventory = data; 
                } else if (data.inventory) {
                    inventory = data.inventory;
                    shoppingList = data.shoppingList || [];
                }
                save();
                alert("Données restaurées !");
            } catch(err) { alert("Fichier invalide"); }
        };
        reader.readAsText(file);
    }

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail', err));
        });
    }

    renderList();
</script>
</body>
</html>
